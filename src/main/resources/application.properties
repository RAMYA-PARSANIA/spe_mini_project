spring.application.name=calculator
server.port=8080

# Write 100 instead of 1E+2 for BigDecimal results
spring.jackson.generator.write-bigdecimal-as-plain=true

# Actuator: expose only health and info over HTTP.
# /actuator/health is used by the Docker and Compose health checks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Adds /actuator/health/liveness and /actuator/health/readiness (useful later for Kubernetes)
management.endpoint.health.probes.enabled=true

management.info.env.enabled=true
info.app.name=Calculator REST API
info.app.version=@project.version@
