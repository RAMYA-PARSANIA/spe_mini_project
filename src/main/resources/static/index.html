<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
</head>
<body>
<h1>Calculator</h1>

<form id="calc">
  <p>a: <input id="a" name="a"></p>
  <p>b: <input id="b" name="b"></p>
  <p>Operation:
    <select id="op">
      <option value="add">add</option>
      <option value="subtract">subtract</option>
      <option value="multiply">multiply</option>
      <option value="divide">divide</option>
    </select>
  </p>
  <button type="submit">Calculate</button>
</form>

<pre id="response"></pre>

<script>
  // Calls GET /api/v1/{op}?a=&b= and prints the JSON response as-is
  document.getElementById('calc').addEventListener('submit', async (event) => {
    event.preventDefault();
    const a = encodeURIComponent(document.getElementById('a').value);
    const b = encodeURIComponent(document.getElementById('b').value);
    const op = document.getElementById('op').value;
    const res = await fetch(`/api/v1/${op}?a=${a}&b=${b}`);
    document.getElementById('response').textContent = JSON.stringify(await res.json(), null, 2);
  });
</script>
</body>
</html>
