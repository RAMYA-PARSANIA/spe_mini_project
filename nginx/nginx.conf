# Reverse proxy in front of the calculator replicas.
# Mounted into the nginx container as /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Re-resolving every 10s means nginx picks up the new
    # container IPs after Jenkins redeploys the app, instead of caching stale ones.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Using a variable forces nginx to resolve "calculator" at request time.
    # Docker DNS returns every replica of the service, so requests are spread across them.
    set $calculator_upstream http://calculator:8080;

    location / {
        proxy_pass $calculator_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Shows which replica answered, handy for demonstrating load balancing
        add_header X-Upstream-Server $upstream_addr always;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Liveness of the proxy itself (does not touch the backend)
    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
    }
}
